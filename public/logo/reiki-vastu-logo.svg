<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" fill="none">
  <!-- Sacred Golden & Ruby Mandala Mark -->
  <g transform="translate(10, 10)">
    <defs>
      <linearGradient id="goldRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#DC2626" />
        <stop offset="50%" stop-color="#F59E0B" />
        <stop offset="100%" stop-color="#D4AF37" />
      </linearGradient>
      <linearGradient id="violetGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#7C3AED" />
        <stop offset="60%" stop-color="#DC2626" />
        <stop offset="100%" stop-color="#FBBF24" />
      </linearGradient>
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>

    <!-- Outer Aura Ring -->
    <circle cx="40" cy="40" r="38" stroke="url(#goldRedGrad)" stroke-width="2.5" fill="none" opacity="0.9" />
    <circle cx="40" cy="40" r="34" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.7" />
    <circle cx="40" cy="40" r="28" fill="url(#violetGoldGrad)" opacity="0.12" />

    <!-- 8 Petals / Sacred Rays -->
    <path d="M40 8 L44 26 L52 14 L49 32 L64 24 L54 36 L70 33 L57 41 L72 40 L57 43 L70 51 L54 48 L64 60 L49 52 L52 70 L44 58 L40 72 L36 58 L28 70 L31 52 L16 60 L26 48 L10 51 L23 43 L8 40 L23 41 L10 33 L26 36 L16 24 L31 32 L28 14 L36 26 Z" fill="url(#goldRedGrad)" opacity="0.75" />

    <!-- Sacred Center Lotus & Cosmic Eye -->
    <circle cx="40" cy="40" r="14" fill="#7C3AED" opacity="0.25" />
    <circle cx="40" cy="40" r="9" fill="url(#goldRedGrad)" filter="url(#glow)" />
    <circle cx="40" cy="40" r="4.5" fill="#FFFDF9" />
  </g>

  <!-- Typography -->
  <g transform="translate(100, 18)">
    <!-- Main Title -->
    <text x="0" y="32" font-family="'Cinzel', 'Playfair Display', serif" font-weight="800" font-size="28" fill="#DC2626" letter-spacing="1.2">
      REIKI <tspan fill="#D4AF37">&amp;</tspan> VAASTU
    </text>
    <text x="268" y="32" font-family="'Cinzel', 'Playfair Display', serif" font-weight="700" font-size="28" fill="#7C3AED" letter-spacing="1.5">
      WORLD
    </text>
    
    <!-- Subtitle / Foundation badge -->
    <text x="2" y="54" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#B45309" letter-spacing="3.2">
      TRAINING &amp; TREATMENT CENTER
    </text>
    <text x="260" y="54" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#991B1B" letter-spacing="1.5">
      • ESTD. 1995
    </text>
  </g>
</svg>
